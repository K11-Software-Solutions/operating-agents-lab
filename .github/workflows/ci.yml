name: Operations gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: Resilience, telemetry, SLO, scheduling tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  gameday:
    name: Game day and generated rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Every scenario produces exactly the expected alerts and outcomes
        run: python -m opsagents.gameday
      - name: The committed Prometheus rules match the SLO definitions
        run: |
          python -m opsagents.slo > /tmp/rules.yaml
          diff -u deploy/prometheus-rules.yaml /tmp/rules.yaml
      - name: Scheduled jobs run, then skip a repeated run
        run: |
          python -m opsagents.scheduled backlog-hygiene --state /tmp/state
          python -m opsagents.scheduled backlog-hygiene --state /tmp/state | grep -q '"status": "skipped"'
          python -m opsagents.scheduled eval-drift --state /tmp/state
